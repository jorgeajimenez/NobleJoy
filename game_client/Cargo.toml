[package]
name = "argon_game_client"
version = "0.1.0"
edition = "2021"
description = "JORGE: Native Rust Desktop Game Engine outsourced to Gemini 4 Argon Managed Agents"

[dependencies]
bevy = { version = "0.14", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
crossbeam-channel = "0.5"
image = "0.25"
